<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dora, Be My Valentine 💖</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: linear-gradient(to bottom right, #ff4e78, #ff9a9e);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Arial', sans-serif;
      text-align: center;
      color: white;
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
      max-width: 400px;
      width: 90%;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    button {
      padding: 12px 25px;
      font-size: 1em;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: 0.3s;
    }

    #yesBtn {
      background: #ff3366;
      color: white;
    }

    #yesBtn:hover {
      background: #ff1f5a;
      transform: scale(1.1);
    }

    #noBtn {
      background: white;
      color: #ff3366;
      position: relative;
    }

    #noBtn:hover {
      transform: translate(
        calc(100px - 200px * Math.random()),
        calc(100px - 200px * Math.random())
      );
    }

    .heart {
      font-size: 3em;
      animation: beat 1s infinite;
    }

    @keyframes beat {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="heart">❤️</div>

    <h1>Dora 💕</h1>
    <p>Will you be my Valentine?</p>

    <div class="buttons">
      <button id="yesBtn" onclick="sayYes()">Yes 💖</button>
      <button id="noBtn">No 💔</button>
    </div>
  </div>

  <script>
    function sayYes() {
      document.body.innerHTML = `
        <div style="
          height:100vh;
          display:flex;
          flex-direction:column;
          justify-content:center;
          align-items:center;
          background:linear-gradient(to bottom right,#ff4e78,#ff9a9e);
          color:white;
          font-family:Arial;
          text-align:center;
        ">
          <h1>Yayyy she said yessss!!! 🎉💖</h1>
          <p style="font-size:1.5em;">
            Dora, you just made me the happiest person 😍<br>
            I can’t wait to celebrate with you,i love you twinnn ❤️
          </p>
          <div style="font-size:3em;">💝💝💝</div>
        </div>
      `;
    }
  </script>

</body>
</html>
